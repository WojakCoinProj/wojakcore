name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_tag:
        description: "If set, upload artifacts to this existing release tag (e.g. 1.12.2.0)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Parallelism for depends + make
  JOBS: 4

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 (depends, with wallet + GUI)
  # ---------------------------------------------------------------------------
  linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison zip \
            libxkbcommon-dev libxcb-xinerama0-dev

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          key: depends-linux-amd64-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
          restore-keys: depends-linux-amd64-

      - name: Build depends
        run: |
          make -C depends HOST=x86_64-pc-linux-gnu -j${JOBS}

      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure \
            --prefix="$PWD/depends/x86_64-pc-linux-gnu" \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests
          make -j${JOBS}
          strip src/wojakcoind src/wojakcoin-cli src/wojakcoin-tx || true
          strip src/qt/wojakcoin-qt || true

      - name: Smoke test daemon (regtest)
        run: |
          DATA="$PWD/smoke-data"
          mkdir -p "$DATA"
          CLI="./src/wojakcoin-cli -regtest -datadir=$DATA -rpcuser=ci -rpcpassword=ci -rpcport=28499"
          ./src/wojakcoind -regtest -datadir="$DATA" -listen=0 -server \
            -rpcuser=ci -rpcpassword=ci -rpcport=28499 -printtoconsole > wojakcoind-smoke.log 2>&1 &
          DPID=$!
          ready=0
          for i in $(seq 1 60); do
            if $CLI getblockcount >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$DPID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::wojakcoind did not become ready on $(uname -m)"
            tail -n 200 wojakcoind-smoke.log || true
            sudo dmesg | tail -n 40 || true
            if kill -0 "$DPID" 2>/dev/null; then
              sudo apt-get install -y gdb >/dev/null 2>&1 || true
              sudo gdb -p "$DPID" -batch -ex 'thread apply all bt' || true
              kill -9 "$DPID" || true
            fi
            exit 1
          fi
          ADDR="$($CLI getnewaddress)"
          $CLI generatetoaddress 5 "$ADDR"
          test "$($CLI getblockcount)" = "5"
          $CLI stop
          wait "$DPID" || true
          echo "smoke test OK on $(uname -m)"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          # Platform-labeled names so release downloads are unambiguous
          cp -f src/wojakcoind      dist/wojakcoind-linux-x86_64
          cp -f src/wojakcoin-cli   dist/wojakcoin-cli-linux-x86_64
          cp -f src/wojakcoin-tx    dist/wojakcoin-tx-linux-x86_64
          cp -f src/qt/wojakcoin-qt dist/wojakcoin-qt-linux-x86_64
          # Zip is the primary release download for Linux x86_64
          (cd dist && zip -9 ../wojakcore-linux-x86_64.zip \
            wojakcoind-linux-x86_64 \
            wojakcoin-cli-linux-x86_64 \
            wojakcoin-tx-linux-x86_64 \
            wojakcoin-qt-linux-x86_64)
          tar -C dist -czf wojakcore-linux-x86_64.tar.gz \
            wojakcoind-linux-x86_64 \
            wojakcoin-cli-linux-x86_64 \
            wojakcoin-tx-linux-x86_64 \
            wojakcoin-qt-linux-x86_64
          ls -lah dist wojakcore-linux-x86_64.zip
          test -s wojakcore-linux-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/wojakcoind-linux-x86_64
            dist/wojakcoin-cli-linux-x86_64
            dist/wojakcoin-tx-linux-x86_64
            dist/wojakcoin-qt-linux-x86_64
            wojakcore-linux-x86_64.zip
            wojakcore-linux-x86_64.tar.gz

  # ---------------------------------------------------------------------------
  # Linux aarch64 (native arm runner, depends, NO_QT)
  # Matches 1.12.1.0 release assets: daemon/cli/tx only (no Qt on aarch64).
  # Qt pulls expat 2.1.0 whose config.guess (2011) cannot identify aarch64.
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: Linux aarch64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison zip

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          # Bump key when NO_QT changes so we don't reuse a Qt/expat cache
          key: depends-linux-arm64-noqt-v2-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/**', 'depends/builders/**') }}
          restore-keys: depends-linux-arm64-noqt-v2-

      - name: Build depends
        run: |
          # Native aarch64: hosts/linux.mk maps aarch64 tools to bare gcc/g++.
          # NO_QT=1 avoids ancient expat/freetype/qt that break config.guess on aarch64.
          HOST="$(./depends/config.guess)"
          echo "HOST=$HOST"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          which gcc g++
          gcc -dumpmachine
          make -C depends HOST="$HOST" NO_QT=1 -j${JOBS} V=1

      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure \
            --prefix="$PWD/depends/${HOST}" \
            --with-gui=no \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests
          make -j${JOBS}
          strip src/wojakcoind src/wojakcoin-cli src/wojakcoin-tx

      # Runs on the native arm64 runner — same environment class as arm64
      # Docker hosts (Apple Silicon, Graviton). Catches aarch64-only startup
      # failures that a QEMU-emulated build/check cannot see.
      - name: Smoke test daemon (regtest)
        run: |
          DATA="$PWD/smoke-data"
          mkdir -p "$DATA"
          CLI="./src/wojakcoin-cli -regtest -datadir=$DATA -rpcuser=ci -rpcpassword=ci -rpcport=28499"
          ./src/wojakcoind -regtest -datadir="$DATA" -listen=0 -server \
            -rpcuser=ci -rpcpassword=ci -rpcport=28499 -printtoconsole > wojakcoind-smoke.log 2>&1 &
          DPID=$!
          ready=0
          for i in $(seq 1 60); do
            if $CLI getblockcount >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$DPID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::wojakcoind did not become ready on $(uname -m)"
            tail -n 200 wojakcoind-smoke.log || true
            sudo dmesg | tail -n 40 || true
            if kill -0 "$DPID" 2>/dev/null; then
              sudo apt-get install -y gdb >/dev/null 2>&1 || true
              sudo gdb -p "$DPID" -batch -ex 'thread apply all bt' || true
              kill -9 "$DPID" || true
            fi
            exit 1
          fi
          ADDR="$($CLI getnewaddress)"
          $CLI generatetoaddress 5 "$ADDR"
          test "$($CLI getblockcount)" = "5"
          $CLI stop
          wait "$DPID" || true
          echo "smoke test OK on $(uname -m)"

      - name: Stage artifacts (aarch64 names)
        run: |
          mkdir -p dist
          # Platform-labeled (daemon/cli/tx only — no Qt on aarch64)
          cp -f src/wojakcoind    dist/wojakcoind-linux-aarch64
          cp -f src/wojakcoin-cli dist/wojakcoin-cli-linux-aarch64
          cp -f src/wojakcoin-tx  dist/wojakcoin-tx-linux-aarch64
          (cd dist && zip -9 ../wojakcore-linux-aarch64.zip \
            wojakcoind-linux-aarch64 \
            wojakcoin-cli-linux-aarch64 \
            wojakcoin-tx-linux-aarch64)
          tar -C dist -czf wojakcore-linux-aarch64.tar.gz \
            wojakcoind-linux-aarch64 \
            wojakcoin-cli-linux-aarch64 \
            wojakcoin-tx-linux-aarch64
          ls -lah dist wojakcore-linux-aarch64.zip
          test -s wojakcore-linux-aarch64.zip
          ./src/wojakcoind -version || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            dist/wojakcoind-linux-aarch64
            dist/wojakcoin-cli-linux-aarch64
            dist/wojakcoin-tx-linux-aarch64
            wojakcore-linux-aarch64.zip
            wojakcore-linux-aarch64.tar.gz

  # ---------------------------------------------------------------------------
  # Windows x86_64 (mingw cross via depends)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison \
            g++-mingw-w64-x86-64 nsis zip
          # Prefer posix threading model for mingw
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          key: depends-win-amd64-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
          restore-keys: depends-win-amd64-

      - name: Build depends
        run: |
          make -C depends HOST=x86_64-w64-mingw32 -j${JOBS}

      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure \
            --prefix="$PWD/depends/x86_64-w64-mingw32" \
            --host=x86_64-w64-mingw32 \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests
          make -j${JOBS}
          x86_64-w64-mingw32-strip src/wojakcoind.exe src/wojakcoin-cli.exe src/wojakcoin-tx.exe || true
          x86_64-w64-mingw32-strip src/qt/wojakcoin-qt.exe || true

      - name: Stage artifacts
        run: |
          mkdir -p dist
          # Platform-labeled .exe names
          cp -f src/wojakcoind.exe      dist/wojakcoind-windows-x86_64.exe
          cp -f src/wojakcoin-cli.exe   dist/wojakcoin-cli-windows-x86_64.exe
          cp -f src/wojakcoin-tx.exe    dist/wojakcoin-tx-windows-x86_64.exe
          cp -f src/qt/wojakcoin-qt.exe dist/wojakcoin-qt-windows-x86_64.exe
          (cd dist && zip -9 ../wojakcore-windows-x86_64.zip \
            wojakcoind-windows-x86_64.exe \
            wojakcoin-cli-windows-x86_64.exe \
            wojakcoin-tx-windows-x86_64.exe \
            wojakcoin-qt-windows-x86_64.exe)
          ls -lah dist wojakcore-windows-x86_64.zip
          test -s wojakcore-windows-x86_64.zip
          ZIP_BYTES=$(stat -c%s wojakcore-windows-x86_64.zip)
          echo "windows zip bytes=$ZIP_BYTES"
          if [ "$ZIP_BYTES" -lt 1000000 ]; then
            echo "ERROR: windows zip too small"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*-windows-x86_64.exe
            wojakcore-windows-x86_64.zip

  # ---------------------------------------------------------------------------
  # macOS arm64 (Homebrew, matching local WojakCore builds)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew update
          # protobuf@21 matches typical WojakCore/BIP70-era builds (keg-only).
          # Latest homebrew protobuf (30+) can break older paymentrequest code.
          brew install automake libtool boost pkg-config python@3 \
            qt@5 libevent berkeley-db@4 openssl@3 librsvg qrencode protobuf@21
          brew list --versions automake libtool boost pkg-config qt@5 libevent \
            berkeley-db@4 openssl@3 qrencode protobuf@21
          export PKG_CONFIG_PATH="$(brew --prefix protobuf@21)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --modversion protobuf
          pkg-config --libs protobuf
          ls "$(brew --prefix boost)/include/boost/system" | head
          ls "$(brew --prefix boost)/lib" | head

      - name: Configure and build
        run: |
          set -e
          eval "$(/opt/homebrew/bin/brew shellenv)"
          export PATH="$(brew --prefix qt@5)/bin:$(brew --prefix protobuf@21)/bin:$PATH"
          BOOST_PREFIX="$(brew --prefix boost)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          BDB_PREFIX="$(brew --prefix berkeley-db@4)"
          QT_PREFIX="$(brew --prefix qt@5)"
          EVENT_PREFIX="$(brew --prefix libevent)"
          PROTOBUF_PREFIX="$(brew --prefix protobuf@21)"
          QRENCODE_PREFIX="$(brew --prefix qrencode)"

          # Homebrew keg-only / versioned formulae need explicit pkg-config paths
          export PKG_CONFIG_PATH="${QT_PREFIX}/lib/pkgconfig:${EVENT_PREFIX}/lib/pkgconfig:${OPENSSL_PREFIX}/lib/pkgconfig:${PROTOBUF_PREFIX}/lib/pkgconfig:${QRENCODE_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          ./autogen.sh
          # Modern Homebrew Boost is mostly header-only for system; need C++14+
          # and explicit -I/-L so AX_BOOST_* macros find headers + libs.
          ./configure \
            --with-gui=qt5 \
            --with-qrencode \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests \
            --without-miniupnpc \
            --with-boost="${BOOST_PREFIX}" \
            BDB_CFLAGS="-I${BDB_PREFIX}/include" \
            BDB_LIBS="-L${BDB_PREFIX}/lib -ldb_cxx-4.8" \
            CPPFLAGS="-I${OPENSSL_PREFIX}/include -I${BOOST_PREFIX}/include -I${PROTOBUF_PREFIX}/include -I${QRENCODE_PREFIX}/include -I/opt/homebrew/include" \
            LDFLAGS="-L${OPENSSL_PREFIX}/lib -L${BOOST_PREFIX}/lib -L${PROTOBUF_PREFIX}/lib -L${QRENCODE_PREFIX}/lib -L/opt/homebrew/lib" \
            PKG_CONFIG_PATH="${PKG_CONFIG_PATH}" \
            CXXFLAGS="-O2 -g -std=c++14" \
            CFLAGS="-O2 -g"
          make -j"$(sysctl -n hw.ncpu)"

      - name: Package CLI + Qt app
        run: |
          set -euo pipefail
          eval "$(/opt/homebrew/bin/brew shellenv)"
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          mkdir -p dist

          test -x src/wojakcoind
          test -x src/wojakcoin-cli
          test -x src/wojakcoin-tx
          test -x src/qt/wojakcoin-qt

          cp -f src/wojakcoind    dist/wojakcoind-macos-arm64
          cp -f src/wojakcoin-cli dist/wojakcoin-cli-macos-arm64
          cp -f src/wojakcoin-tx  dist/wojakcoin-tx-macos-arm64

          # Remove any stale shells from previous runs / accidental leftovers
          rm -rf WojakCore-Qt.app Bitcoin-Qt.app

          # Build .app via Makefile (requires wojakcoin-qt path fix in Makefile.am).
          # Do NOT swallow errors — empty shells were previously uploaded as "releases".
          make appbundle

          APPDIR=WojakCore-Qt.app
          EXE="$APPDIR/Contents/MacOS/WojakCore-Qt"
          if [ ! -x "$EXE" ]; then
            echo "ERROR: make appbundle did not produce $EXE"
            find "$APPDIR" -type f 2>/dev/null || true
            ls -la src/qt/
            exit 1
          fi

          # Bundle Qt frameworks + plugins (Homebrew qt@5)
          if command -v macdeployqt >/dev/null 2>&1; then
            macdeployqt "$APPDIR" -verbose=1
          else
            echo "ERROR: macdeployqt not found (qt@5 bin not on PATH)"
            exit 1
          fi

          # macdeployqt does not pull transitive Homebrew Boost deps
          # (libboost_atomic, libboost_container, …). Bundle them recursively.
          # (contrib/macdeploy/macdeployqtplus is Python 2-only — do not use.)
          python3 contrib/macdeploy/bundle-dylibs.py "$APPDIR"

          # Explicit safety net for known Boost transitive dylibs
          BOOST_LIB="$(brew --prefix boost)/lib"
          FW="$APPDIR/Contents/Frameworks"
          mkdir -p "$FW"
          for dep in libboost_atomic.dylib libboost_container.dylib libboost_chrono.dylib \
                     libboost_system.dylib libboost_filesystem.dylib \
                     libboost_program_options.dylib libboost_thread.dylib; do
            if [ -f "$BOOST_LIB/$dep" ] && [ ! -f "$FW/$dep" ]; then
              echo "copy missing $dep"
              cp -f "$BOOST_LIB/$dep" "$FW/"
              chmod u+w "$FW/$dep"
              install_name_tool -id "@executable_path/../Frameworks/$dep" "$FW/$dep" || true
            fi
          done
          # Rewrite any remaining @loader_path boost refs inside Frameworks
          for f in "$FW"/libboost_*.dylib; do
            [ -f "$f" ] || continue
            chmod u+w "$f"
            otool -L "$f" | awk '/@loader_path\// {print $1}' | while read -r ref; do
              base="${ref##*/}"
              if [ -f "$FW/$base" ]; then
                install_name_tool -change "$ref" \
                  "@executable_path/../Frameworks/$base" "$f" || true
              fi
            done
          done

          # Re-run bundler once more after safety-net copies
          python3 contrib/macdeploy/bundle-dylibs.py "$APPDIR"

          # Ad-hoc sign AFTER all dylib rewrites (signature must be last)
          codesign --force --deep --sign - "$APPDIR"
          codesign -dv --verbose=2 "$APPDIR" 2>&1 | head -20

          # Hard fail if the zip would be an empty shell again (<1MB is broken)
          APP_BYTES=$(du -sk "$APPDIR" | awk '{print $1 * 1024}')
          EXE_BYTES=$(stat -f%z "$EXE")
          echo "App size bytes=$APP_BYTES exe bytes=$EXE_BYTES"
          if [ "$EXE_BYTES" -lt 1000000 ]; then
            echo "ERROR: executable too small ($EXE_BYTES) — packaging failed"
            exit 1
          fi
          if [ "$APP_BYTES" -lt 10000000 ]; then
            echo "ERROR: app bundle too small ($APP_BYTES) — Qt frameworks missing?"
            find "$APPDIR" -type f | head -50
            exit 1
          fi

          # Smoke-test: binary must load dylibs and print version.
          # Note: wojakcoin-qt -version often exits non-zero after printing
          # (Bitcoin-Qt AppInit path) — check stdout/stderr, not exit code.
          set +e
          VER_OUT="$("$EXE" -version 2>&1)"
          VER_RC=$?
          set -e
          echo "$VER_OUT"
          echo "(exit code $VER_RC — ignored if version string present)"
          if ! echo "$VER_OUT" | grep -Eqi 'WojakCore version|version v?[0-9]'; then
            echo "ERROR: bundled app failed to print version (missing dylibs?)"
            echo "=== otool -L main ==="
            otool -L "$EXE" | head -40
            echo "=== Frameworks ==="
            ls -la "$FW" | head -60
            exit 1
          fi
          # dyld hard-fail still shows up as empty output + abort message
          if echo "$VER_OUT" | grep -Eqi 'Library not loaded|dyld\[|Abort trap|image not found'; then
            echo "ERROR: dyld failure while running bundled app"
            exit 1
          fi

          # Platform-labeled zip name (not the old empty-shell asset name)
          APP_ZIP=WojakCore-Qt-macos-arm64.app.zip
          ditto -c -k --sequesterRsrc --keepParent "$APPDIR" "$APP_ZIP"
          ZIP_BYTES=$(stat -f%z "$APP_ZIP")
          echo "Zip size bytes=$ZIP_BYTES"
          if [ "$ZIP_BYTES" -lt 5000000 ]; then
            echo "ERROR: zip too small ($ZIP_BYTES) — refusing to upload empty shell"
            exit 1
          fi

          cp -f "$APP_ZIP" dist/
          # CLI tools zip (no GUI frameworks)
          (cd dist && zip -9 ../wojakcore-macos-arm64-cli.zip \
            wojakcoind-macos-arm64 \
            wojakcoin-cli-macos-arm64 \
            wojakcoin-tx-macos-arm64)
          tar -C dist -czf wojakcore-macos-arm64-cli.tar.gz \
            wojakcoind-macos-arm64 \
            wojakcoin-cli-macos-arm64 \
            wojakcoin-tx-macos-arm64
          ls -lah dist "$APP_ZIP" wojakcore-macos-arm64-cli.zip
          ls -la "$APPDIR/Contents/MacOS/"
          ls -la "$APPDIR/Contents/Frameworks/" | head

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*
            WojakCore-Qt-macos-arm64.app.zip
            wojakcore-macos-arm64-cli.zip
            wojakcore-macos-arm64-cli.tar.gz

  # ---------------------------------------------------------------------------
  # Publish all artifacts to the GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release assets
    needs: [linux-amd64, linux-arm64, windows, macos]
    runs-on: ubuntu-22.04
    if: github.event_name == 'release' || inputs.upload_tag != ''
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.upload_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and list artifacts
        run: |
          mkdir -p upload
          # Publish ONLY the platform zip bundles (no loose binaries / tar.gz twins)
          find artifacts -type f \( \
            -name 'wojakcore-linux-x86_64.zip' -o \
            -name 'wojakcore-linux-aarch64.zip' -o \
            -name 'wojakcore-windows-x86_64.zip' -o \
            -name 'wojakcore-macos-arm64-cli.zip' -o \
            -name 'WojakCore-Qt-macos-arm64.app.zip' \
          \) -exec cp -f {} upload/ \;
          echo "=== Release upload set (zip-only, platform-labeled) ==="
          ls -lah upload
          for req in \
            wojakcore-linux-x86_64.zip \
            wojakcore-linux-aarch64.zip \
            wojakcore-windows-x86_64.zip \
            wojakcore-macos-arm64-cli.zip \
            WojakCore-Qt-macos-arm64.app.zip
          do
            if [ ! -f "upload/$req" ]; then
              echo "ERROR: missing required release asset: $req"
              find artifacts -type f | sort
              exit 1
            fi
            BYTES=$(stat -c%s "upload/$req")
            echo "ok $req ($BYTES bytes)"
            if [ "$BYTES" -lt 100000 ]; then
              echo "ERROR: $req is suspiciously small ($BYTES)"
              exit 1
            fi
          done
          MAC_BYTES=$(stat -c%s upload/WojakCore-Qt-macos-arm64.app.zip)
          if [ "$MAC_BYTES" -lt 5000000 ]; then
            echo "ERROR: WojakCore-Qt-macos-arm64.app.zip too small ($MAC_BYTES) — empty shell?"
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
