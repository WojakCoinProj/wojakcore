# Compile check for rebase-0.21.2 — same four platforms as the 1.12 release CI.
# Does not publish release assets; only verifies the branch builds.
name: Compile

on:
  push:
    branches: [rebase-0.21.2]
  pull_request:
    branches: [rebase-0.21.2]
  workflow_dispatch:

env:
  JOBS: 4

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 (depends + wallet + GUI)
  # ---------------------------------------------------------------------------
  linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison \
            libxkbcommon-dev libxcb-xinerama0-dev

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          key: depends-021-linux-amd64-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
          restore-keys: depends-021-linux-amd64-

      - name: Build depends
        run: make -C depends HOST=x86_64-pc-linux-gnu -j${JOBS}

      - name: Configure and build
        run: |
          set -e
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure \
            --prefix="$PWD/depends/x86_64-pc-linux-gnu" \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests \
            --with-gui=qt5
          make -j${JOBS}
          test -x src/wojakcoind
          test -x src/wojakcoin-cli
          test -x src/wojakcoin-tx
          test -x src/qt/wojakcoin-qt
          ./src/wojakcoind -version | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            src/wojakcoind
            src/wojakcoin-cli
            src/wojakcoin-tx
            src/qt/wojakcoin-qt

  # ---------------------------------------------------------------------------
  # Linux aarch64 (native arm runner, depends, NO_QT for speed/reliability)
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: Linux aarch64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          key: depends-021-linux-arm64-noqt-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/**', 'depends/builders/**') }}
          restore-keys: depends-021-linux-arm64-noqt-

      - name: Build depends
        run: |
          HOST="$(./depends/config.guess)"
          echo "HOST=$HOST"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          make -C depends HOST="$HOST" NO_QT=1 -j${JOBS}

      - name: Configure and build
        run: |
          set -e
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" ./configure \
            --prefix="$PWD/depends/${HOST}" \
            --with-gui=no \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests
          make -j${JOBS}
          test -x src/wojakcoind
          test -x src/wojakcoin-cli
          test -x src/wojakcoin-tx
          ./src/wojakcoind -version | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            src/wojakcoind
            src/wojakcoin-cli
            src/wojakcoin-tx

  # ---------------------------------------------------------------------------
  # Windows x86_64 (mingw cross via depends)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison \
            g++-mingw-w64-x86-64 nsis zip
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          key: depends-021-win-amd64-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
          restore-keys: depends-021-win-amd64-

      - name: Build depends
        run: make -C depends HOST=x86_64-w64-mingw32 -j${JOBS}

      - name: Configure and build
        run: |
          set -e
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-w64-mingw32/share/config.site" ./configure \
            --prefix="$PWD/depends/x86_64-w64-mingw32" \
            --host=x86_64-w64-mingw32 \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests \
            --without-boost-process
          # MinGW can false-positive -Wreturn-type (Bitcoin Core NO_WERROR pattern)
          make -j${JOBS} || make -j${JOBS} NO_WERROR=1
          test -x src/wojakcoind.exe
          test -x src/wojakcoin-cli.exe
          test -x src/wojakcoin-tx.exe
          test -x src/qt/wojakcoin-qt.exe
          ls -la src/wojakcoind.exe src/wojakcoin-cli.exe src/wojakcoin-tx.exe src/qt/wojakcoin-qt.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            src/wojakcoind.exe
            src/wojakcoin-cli.exe
            src/wojakcoin-tx.exe
            src/qt/wojakcoin-qt.exe

  # ---------------------------------------------------------------------------
  # macOS arm64 (Homebrew, native Apple Silicon runner)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew update
          brew install automake libtool boost pkg-config python@3 \
            qt@5 libevent berkeley-db@4 openssl@3 librsvg qrencode miniupnpc
          brew list --versions automake libtool boost pkg-config qt@5 libevent \
            berkeley-db@4 openssl@3 qrencode miniupnpc || true

      - name: Configure and build
        run: |
          set -e
          eval "$(/opt/homebrew/bin/brew shellenv)"
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          BOOST_PREFIX="$(brew --prefix boost)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          BDB_PREFIX="$(brew --prefix berkeley-db@4)"
          QT_PREFIX="$(brew --prefix qt@5)"
          EVENT_PREFIX="$(brew --prefix libevent)"
          QRENCODE_PREFIX="$(brew --prefix qrencode)"

          export PKG_CONFIG_PATH="${QT_PREFIX}/lib/pkgconfig:${EVENT_PREFIX}/lib/pkgconfig:${OPENSSL_PREFIX}/lib/pkgconfig:${QRENCODE_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          ./autogen.sh
          ./configure \
            --with-gui=qt5 \
            --with-qrencode \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests \
            --with-boost="${BOOST_PREFIX}" \
            BDB_CFLAGS="-I${BDB_PREFIX}/include" \
            BDB_LIBS="-L${BDB_PREFIX}/lib -ldb_cxx-4.8" \
            CPPFLAGS="-I${OPENSSL_PREFIX}/include -I${BOOST_PREFIX}/include -I${QRENCODE_PREFIX}/include -I/opt/homebrew/include" \
            LDFLAGS="-L${OPENSSL_PREFIX}/lib -L${BOOST_PREFIX}/lib -L${QRENCODE_PREFIX}/lib -L/opt/homebrew/lib" \
            PKG_CONFIG_PATH="${PKG_CONFIG_PATH}" \
            CXXFLAGS="-O2 -g -std=c++17" \
            CFLAGS="-O2 -g"
          make -j"$(sysctl -n hw.ncpu)"
          test -x src/wojakcoind
          test -x src/wojakcoin-cli
          test -x src/wojakcoin-tx
          test -x src/qt/wojakcoin-qt
          ./src/wojakcoind -version | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src/wojakcoind
            src/wojakcoin-cli
            src/wojakcoin-tx
            src/qt/wojakcoin-qt
