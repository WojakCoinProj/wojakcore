# Full multi-platform compile with Qt for rebase-0.21.2
# Jobs match release matrix: Linux x86_64, Linux aarch64, Windows x86_64, macOS arm64
name: Compile

on:
  push:
    branches: [rebase-0.21.2]
  pull_request:
    branches: [rebase-0.21.2]
  workflow_dispatch:

env:
  JOBS: 4

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 — depends (incl. Boost + Qt) + full GUI
  # ---------------------------------------------------------------------------
  linux-amd64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison \
            libxkbcommon-dev libxcb-xinerama0-dev

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          key: depends-021-qt-linux-amd64-v2-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**', 'depends/funcs.mk') }}
          restore-keys: depends-021-qt-linux-amd64-v2-

      - name: Build depends (with Qt)
        run: make -C depends HOST=x86_64-pc-linux-gnu -j${JOBS}

      - name: Configure and build (with Qt)
        run: |
          set -e
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure \
            --prefix="$PWD/depends/x86_64-pc-linux-gnu" \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests \
            --with-gui=qt5
          make -j${JOBS}
          test -x src/wojakcoind
          test -x src/wojakcoin-cli
          test -x src/wojakcoin-tx
          test -x src/qt/wojakcoin-qt
          ./src/wojakcoind -version | head -5
          file src/qt/wojakcoin-qt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            src/wojakcoind
            src/wojakcoin-cli
            src/wojakcoin-tx
            src/qt/wojakcoin-qt

  # ---------------------------------------------------------------------------
  # Linux aarch64 — depends with Qt (native arm runner)
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: Linux aarch64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison \
            libxkbcommon-dev libxcb-xinerama0-dev

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          key: depends-021-qt-linux-arm64-v2-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**', 'depends/funcs.mk') }}
          restore-keys: depends-021-qt-linux-arm64-v2-

      - name: Build depends (with Qt)
        run: |
          HOST="$(./depends/config.guess)"
          echo "HOST=$HOST"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          make -C depends HOST="$HOST" -j${JOBS}

      - name: Configure and build (with Qt)
        run: |
          set -e
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/${HOST}/share/config.site" ./configure \
            --prefix="$PWD/depends/${HOST}" \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests \
            --with-gui=qt5
          make -j${JOBS}
          test -x src/wojakcoind
          test -x src/wojakcoin-cli
          test -x src/wojakcoin-tx
          test -x src/qt/wojakcoin-qt
          ./src/wojakcoind -version | head -5
          file src/qt/wojakcoin-qt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            src/wojakcoind
            src/wojakcoin-cli
            src/wojakcoin-tx
            src/qt/wojakcoin-qt

  # ---------------------------------------------------------------------------
  # Windows x86_64 — mingw depends with Qt
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 gperf bison \
            g++-mingw-w64-x86-64 nsis zip
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
            depends/SDKs
          key: depends-021-qt-win-amd64-v2-${{ hashFiles('depends/packages/*', 'depends/patches/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**', 'depends/funcs.mk') }}
          restore-keys: depends-021-qt-win-amd64-v2-

      - name: Build depends (with Qt)
        run: |
          # Full Qt GUI cross-build (boost/qt GCC11 patches required)
          make -C depends HOST=x86_64-w64-mingw32 -j${JOBS}

      - name: Configure and build (with Qt)
        run: |
          set -e
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-w64-mingw32/share/config.site" ./configure \
            --prefix="$PWD/depends/x86_64-w64-mingw32" \
            --host=x86_64-w64-mingw32 \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests \
            --with-gui=qt5 \
            --without-boost-process
          make -j${JOBS}
          test -f src/wojakcoind.exe
          test -f src/wojakcoin-cli.exe
          test -f src/wojakcoin-tx.exe
          test -f src/qt/wojakcoin-qt.exe
          ls -lah src/wojakcoind.exe src/wojakcoin-cli.exe src/wojakcoin-tx.exe src/qt/wojakcoin-qt.exe
          file src/qt/wojakcoin-qt.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            src/wojakcoind.exe
            src/wojakcoin-cli.exe
            src/wojakcoin-tx.exe
            src/qt/wojakcoin-qt.exe

  # ---------------------------------------------------------------------------
  # macOS arm64 — Homebrew Qt5 (full GUI)
  # ---------------------------------------------------------------------------
  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew update
          brew install automake libtool boost pkg-config python@3 \
            qt@5 libevent berkeley-db@4 openssl@3 librsvg qrencode miniupnpc
          brew list --versions automake libtool boost pkg-config qt@5 libevent \
            berkeley-db@4 openssl@3 qrencode miniupnpc

      - name: Configure and build (with Qt)
        run: |
          set -e
          eval "$(/opt/homebrew/bin/brew shellenv)"
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          BOOST_PREFIX="$(brew --prefix boost)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          BDB_PREFIX="$(brew --prefix berkeley-db@4)"
          QT_PREFIX="$(brew --prefix qt@5)"
          EVENT_PREFIX="$(brew --prefix libevent)"
          QRENCODE_PREFIX="$(brew --prefix qrencode)"

          # Modern Homebrew Boost is often header-only for "system"; AX_BOOST_SYSTEM
          # still looks for -lboost_system. Provide a local link dir that satisfies it.
          mkdir -p "$PWD/.boost-libs"
          shopt -s nullglob
          for f in "$BOOST_PREFIX"/lib/libboost_*.dylib "$BOOST_PREFIX"/lib/libboost_*.a; do
            ln -sfn "$f" "$PWD/.boost-libs/$(basename "$f")"
          done
          # If libboost_system is missing (header-only), alias filesystem for the linker check.
          if [ ! -e "$PWD/.boost-libs/libboost_system.dylib" ] && [ ! -e "$PWD/.boost-libs/libboost_system.a" ]; then
            if [ -e "$PWD/.boost-libs/libboost_filesystem.dylib" ]; then
              ln -sfn libboost_filesystem.dylib "$PWD/.boost-libs/libboost_system.dylib"
            elif [ -e "$PWD/.boost-libs/libboost_filesystem.a" ]; then
              ln -sfn libboost_filesystem.a "$PWD/.boost-libs/libboost_system.a"
            fi
          fi
          ls -la "$PWD/.boost-libs" | head -40

          export PKG_CONFIG_PATH="${QT_PREFIX}/lib/pkgconfig:${EVENT_PREFIX}/lib/pkgconfig:${OPENSSL_PREFIX}/lib/pkgconfig:${QRENCODE_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          ./autogen.sh
          ./configure \
            --with-gui=qt5 \
            --with-qrencode \
            --disable-tests \
            --disable-bench \
            --disable-gui-tests \
            --with-boost="${BOOST_PREFIX}" \
            --with-boost-libdir="$PWD/.boost-libs" \
            BDB_CFLAGS="-I${BDB_PREFIX}/include" \
            BDB_LIBS="-L${BDB_PREFIX}/lib -ldb_cxx-4.8" \
            CPPFLAGS="-I${OPENSSL_PREFIX}/include -I${BOOST_PREFIX}/include -I${QRENCODE_PREFIX}/include -I/opt/homebrew/include" \
            LDFLAGS="-L${OPENSSL_PREFIX}/lib -L$PWD/.boost-libs -L${QRENCODE_PREFIX}/lib -L/opt/homebrew/lib" \
            PKG_CONFIG_PATH="${PKG_CONFIG_PATH}" \
            CXXFLAGS="-O2 -g -std=c++17" \
            CFLAGS="-O2 -g"
          make -j"$(sysctl -n hw.ncpu)"
          test -x src/wojakcoind
          test -x src/wojakcoin-cli
          test -x src/wojakcoin-tx
          test -x src/qt/wojakcoin-qt
          ./src/wojakcoind -version | head -5
          file src/qt/wojakcoin-qt

      - name: Package WojakCoin-Qt.app
        run: |
          set -euo pipefail
          eval "$(/opt/homebrew/bin/brew shellenv)"
          export PATH="$(brew --prefix qt@5)/bin:$PATH"

          # Build .app shell + install binary as Contents/MacOS/WojakCoin-Qt
          rm -rf WojakCoin-Qt.app Bitcoin-Qt.app
          make appbundle

          APPDIR=WojakCoin-Qt.app
          EXE="$APPDIR/Contents/MacOS/WojakCoin-Qt"
          if [ ! -x "$EXE" ]; then
            echo "ERROR: make appbundle did not produce $EXE"
            find "$APPDIR" -type f 2>/dev/null || true
            ls -la src/qt/
            exit 1
          fi

          # Bundle Qt frameworks + plugins from Homebrew qt@5
          if ! command -v macdeployqt >/dev/null 2>&1; then
            echo "ERROR: macdeployqt not found"
            exit 1
          fi
          macdeployqt "$APPDIR" -verbose=1

          # Pull non-Qt Homebrew dylibs (boost, openssl, bdb, event, etc.)
          python3 contrib/macdeploy/bundle-dylibs.py "$APPDIR"

          # Safety net for common Boost transitive dylibs
          BOOST_LIB="$(brew --prefix boost)/lib"
          FW="$APPDIR/Contents/Frameworks"
          mkdir -p "$FW"
          for dep in libboost_atomic.dylib libboost_container.dylib libboost_chrono.dylib \
                     libboost_system.dylib libboost_filesystem.dylib \
                     libboost_program_options.dylib libboost_thread.dylib; do
            if [ -f "$BOOST_LIB/$dep" ] && [ ! -f "$FW/$dep" ]; then
              echo "copy missing $dep"
              cp -f "$BOOST_LIB/$dep" "$FW/"
              chmod u+w "$FW/$dep"
              install_name_tool -id "@executable_path/../Frameworks/$dep" "$FW/$dep" || true
            fi
          done
          for f in "$FW"/libboost_*.dylib; do
            [ -f "$f" ] || continue
            chmod u+w "$f"
            otool -L "$f" | awk '/@loader_path\// {print $1}' | while read -r ref; do
              base="${ref##*/}"
              if [ -f "$FW/$base" ]; then
                install_name_tool -change "$ref" \
                  "@executable_path/../Frameworks/$base" "$f" || true
              fi
            done
          done
          python3 contrib/macdeploy/bundle-dylibs.py "$APPDIR"

          # Sign after all install_name rewrites
          codesign --force --deep --sign - "$APPDIR"
          codesign -dv --verbose=2 "$APPDIR" 2>&1 | head -20

          APP_BYTES=$(du -sk "$APPDIR" | awk '{print $1 * 1024}')
          EXE_BYTES=$(stat -f%z "$EXE")
          echo "App size bytes=$APP_BYTES exe bytes=$EXE_BYTES"
          if [ "$EXE_BYTES" -lt 1000000 ]; then
            echo "ERROR: executable too small ($EXE_BYTES)"
            exit 1
          fi
          if [ "$APP_BYTES" -lt 10000000 ]; then
            echo "ERROR: app bundle too small ($APP_BYTES) — frameworks missing?"
            find "$APPDIR" -type f | head -50
            exit 1
          fi

          # Smoke-test (version may exit non-zero after printing)
          set +e
          VER_OUT="$("$EXE" -version 2>&1)"
          VER_RC=$?
          set -e
          echo "$VER_OUT"
          echo "(exit code $VER_RC)"
          if ! echo "$VER_OUT" | grep -Eqi 'WojakCoin|version'; then
            echo "ERROR: bundled app failed to print version"
            otool -L "$EXE" | head -40
            ls -la "$FW" | head -40
            exit 1
          fi
          if echo "$VER_OUT" | grep -Eqi 'Library not loaded|dyld\[|Abort trap|image not found'; then
            echo "ERROR: dyld failure"
            exit 1
          fi

          APP_ZIP=WojakCoin-Qt-macos-arm64.app.zip
          ditto -c -k --sequesterRsrc --keepParent "$APPDIR" "$APP_ZIP"
          ZIP_BYTES=$(stat -f%z "$APP_ZIP")
          echo "Zip size bytes=$ZIP_BYTES"
          if [ "$ZIP_BYTES" -lt 5000000 ]; then
            echo "ERROR: zip too small ($ZIP_BYTES)"
            exit 1
          fi
          ls -lah "$APP_ZIP" "$APPDIR/Contents/MacOS/"
          ls -la "$FW" | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src/wojakcoind
            src/wojakcoin-cli
            src/wojakcoin-tx
            src/qt/wojakcoin-qt
            WojakCoin-Qt-macos-arm64.app.zip
